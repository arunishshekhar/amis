<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMIS Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09090b;
      --panel: #18181b;
      --panel-soft: #121216;
      --line: #2a2a30;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --dim: #71717a;
      --accent: #14b8a6;
      --danger: #ef4444;
      --warn: #f59e0b;
      --ok: #22c55e;
      --focus: #67e8f9;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.4;
    }

    button, input, select {
      font: inherit;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #27272a;
      color: var(--text);
      padding: 8px 10px;
      cursor: pointer;
    }

    button:hover { border-color: #3f3f46; background: #303036; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button:focus, input:focus, select:focus { outline: 2px solid var(--focus); outline-offset: 2px; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #042f2e; font-weight: 700; }
    button.danger { background: #451a1a; border-color: #7f1d1d; color: #fecaca; }
    button.ghost { background: transparent; }

    .shell {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    header {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 14px;
      margin-bottom: 14px;
    }

    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 22px; letter-spacing: 0; }
    h2 { font-size: 16px; }
    h3 { font-size: 15px; }

    .subtle { color: var(--muted); font-size: 13px; }
    .status { color: var(--dim); font-size: 12px; margin-top: 4px; }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .tab[aria-selected="true"] {
      background: #e4e4e7;
      color: #18181b;
      border-color: #e4e4e7;
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric, .card, .panel {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 8px;
    }

    .metric { padding: 12px; min-height: 74px; }
    .metric strong { display: block; font-size: 24px; line-height: 1.1; }

    .panel { padding: 14px; }
    .list { display: grid; gap: 10px; }
    .card { padding: 12px; display: grid; gap: 10px; }
    .card-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
    .title { font-weight: 700; overflow-wrap: anywhere; }
    .body { color: #d4d4d8; white-space: pre-wrap; overflow-wrap: anywhere; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .toolbar, .pager {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .pager { margin-top: 12px; }
    .toolbar label { max-width: 220px; }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .pill.high { color: #fecaca; border-color: #7f1d1d; background: #2b1111; }
    .pill.medium { color: #fde68a; border-color: #92400e; background: #2b1d0b; }
    .pill.low { color: #bbf7d0; border-color: #166534; background: #102116; }
    .pill.monitor { color: #bae6fd; border-color: #075985; background: #0b1f2a; }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      padding: 24px;
      text-align: center;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }

    label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; }
    .secret-status { color: var(--muted); font-size: 12px; }
    .secret-status.configured { color: #bbf7d0; }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #09090b;
      color: var(--text);
      padding: 9px 10px;
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      max-width: min(420px, calc(100vw - 32px));
      border: 1px solid var(--line);
      background: #18181b;
      border-radius: 8px;
      padding: 12px 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      display: none;
    }

    @media (max-width: 760px) {
      .shell { padding: 12px; }
      header { align-items: flex-start; flex-direction: column; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .form-grid { grid-template-columns: 1fr; }
      .card-head { flex-direction: column; }
      .toolbar, .pager { align-items: stretch; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>AMIS Dashboard</h1>
        <p class="subtle" id="community">Loading moderation intelligence</p>
        <p class="status" id="status">Connecting...</p>
      </div>
      <button id="refresh" class="ghost" type="button">Refresh</button>
    </header>

    <nav class="tabs" aria-label="Dashboard views">
      <button class="tab" type="button" data-view="triage" aria-selected="true">Triage</button>
      <button class="tab" type="button" data-view="history" aria-selected="false">History</button>
      <button class="tab" type="button" data-view="insights" aria-selected="false">Insights</button>
      <button class="tab" type="button" data-view="settings" aria-selected="false">Settings</button>
    </nav>

    <section class="grid" aria-label="Dashboard metrics">
      <div class="metric"><span class="subtle">Needs review</span><strong id="metric-review">0</strong></div>
      <div class="metric"><span class="subtle">AI-approved</span><strong id="metric-approved">0</strong></div>
      <div class="metric"><span class="subtle">History</span><strong id="metric-history">0</strong></div>
      <div class="metric"><span class="subtle">Open insights</span><strong id="metric-insights">0</strong></div>
    </section>

    <section id="view" class="panel" aria-live="polite"></section>
  </main>
  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="/main.js"></script>
</body>
</html>
